[project]
authors = [{ name = "Adrien Plaçais", email = "placais@lpsc.in2p3.fr" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.10.8, <4",
  "numpy>=2.4.2, <3",
  "openpyxl>=3.1.5,<4",
  "pandas>=3.0.1, <4",
  "pandas-stubs>=3.0.0,<4",
  "pre-commit>=4.5.1, <5",
  "PyQt6>=6.10, <7",
  "scipy>=1.17.1, <2",
]
description = "Post-treat the data produced by the MULTIPAC test bench."
dynamic = ["version"]
keywords = ["post treatment", "multipactor"]
name = "multipac_testbench"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
docs = [
  "myst-parser>=5.0.0, <6",
  "nbsphinx>=0.9.8, <1",
  "sphinx>=9.1.0,<10",
  "sphinx-autodoc-typehints>=3.11.0, <4",
  "sphinx-rtd-theme>=3.1.0, <4",
  "sphinx-tabs>=3.4.7,<4",
  "sphinxcontrib-bibtex>=2.6.5,<3",
]
notebooks = ["jupyter>=1.1.1,<2"]
test = [
  "nbconvert>=7.17.0,<8",
  "nbmake>=1.5.5,<2",
  "pytest-mock>=3.15.1, <4",
  "pytest>=9.0.2, <10",
  "pytest-lazy-fixtures>=1.4.0,<2",
]

[project.scripts]

[project.urls]
Documentation = "https://multipac-testbench.readthedocs.io/en/latest/"
Homepage = "https://github.com/AdrienPlacais/multipac_testbench"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
src_paths = ["./multipac_testbench/"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
filterwarnings = ["ignore:.*cKDTree.*:DeprecationWarning"]
markers = [
  "notebook: mark tests that rely on the execution of notebook without error",
  "slow: mark slow tests (typically > 5s)",
  "implementation: mark tests currently under implementation",
]
minversion = "6.0"
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools_scm]

[tool.cibuildwheel]
build-verbosity = 1
test-command = 'pytest {project}/tests -m "not slow and not notebook"'
test-extras = "test"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools-scm>=8, <9"]
